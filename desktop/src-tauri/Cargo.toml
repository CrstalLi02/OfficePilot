[package]
name = "officepilot-desktop"
version = "0.1.0"
edition = "2021"
description = "OfficePilot 桌面版：在本机运行的 AI 办公助手"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
walioffice = { path = "../../server" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
