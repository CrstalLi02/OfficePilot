[package]
name = "officepilot-engine"
version = "0.1.0"
edition = "2021"
description = "OfficePilot 文档引擎：原格式读写 .docx / .xlsx / .pptx，只改动过的部分"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
rust_xlsxwriter = "0.79"
docx-rs = "0.4"
