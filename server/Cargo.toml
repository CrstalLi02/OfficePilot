[package]
name = "walioffice"
version = "1.0.0"
edition = "2021"
description = "WaLiOffice - Web AI Agent for office workflows"

[[bin]]
name = "walioffice"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "compression-gzip"] }

# SSE streaming
async-stream = "0.3"
futures = "0.3"

# HTTP client for LLM
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
eventsource-stream = "0.2"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "mysql", "any", "chrono", "uuid", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
jsonwebtoken = "9"
bcrypt = "0.16"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"

# Utils
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"

# Static asset embedding
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

# Document rendering
docx-rs = "0.4"
# 数据分析：进程内 SQL 引擎（纯 Rust、基于 Arrow，异步执行）+ 纯 Rust 读取 Excel
# 54.x 的最低 Rust 版本是 1.88，与 Dockerfile 的构建镜像一致
datafusion = { version = "54.1", default-features = false, features = ["sql", "math_expressions", "datetime_expressions", "string_expressions", "unicode_expressions", "regex_expressions", "nested_expressions", "recursive_protection"] }
calamine = { version = "0.36", features = ["dates"] }
# 定时任务：cron 表达式（5 段，支持 L / W / #）与时区
croner = "4"
# IM 远程控制：飞书长连接（WebSocket）、事件解密、密钥加密存储
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
chrono-tz = "0.10"
# GBK 编码的 CSV（国内 Excel 导出常见）
encoding_rs = "0.8"
rust_xlsxwriter = "0.79"
zip = "2"

async-trait = "0.1"

tokio-stream = "0.1"
tokio-util = "0.7"

# Misc
regex = "1"
urlencoding = "2"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
