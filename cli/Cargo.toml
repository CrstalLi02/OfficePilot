[package]
name = "officepilot-cli"
version = "0.1.0"
edition = "2021"
description = "officepilot 命令行：在本机创建、读取、修改、转换真实的 Word / Excel / PPT 文件"

[[bin]]
name = "officepilot"
path = "src/main.rs"

[dependencies]
officepilot-engine = { path = "../engine" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MCP HTTP 传输：同步的小型 HTTP 服务器，不引入异步运行时
tiny_http = "0.12"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
ureq = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
